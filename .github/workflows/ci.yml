name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor declared in composer.json; 8.4 proves the lock
        # also installs on a newer runtime than it was resolved against.
        php: ['8.3', '8.4']

    name: test (PHP ${{ matrix.php }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, dom, simplexml, mbstring
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build front-end
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite covers the eight locales, the page cache, the admin panel
      # and the translation files themselves.
      - name: Run tests
        run: php artisan test

      - name: Check formatting
        run: vendor/bin/pint --test
