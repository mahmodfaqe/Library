server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16m;

    # The host's nginx already sets these; keep the container quiet.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets and uploads are fingerprinted or versioned, so they can be
    # cached hard. The favicon carries ?v= for the same reason.
    location ~* ^/(build|file|fonts)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; try_files $uri =404; }
    location = /robots.txt  { access_log off; try_files $uri =404; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles.
    location ~ /\. { deny all; }
}
