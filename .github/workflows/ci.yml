name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor declared in composer.json; 8.4 proves the lock
        # also installs on a newer runtime than it was resolved against.
        php: ['8.3', '8.4']

    name: test (PHP ${{ matrix.php }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, dom, simplexml, mbstring
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build front-end
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite covers the eight locales, the page cache, the admin panel
      # and the translation files themselves.
      - name: Run tests
        run: php artisan test

      - name: Check formatting
        run: vendor/bin/pint --test

  deploy:
    # Only a green build reaches the server, and only from main.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Check the deploy secrets are set
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          URL: ${{ secrets.DEPLOY_URL }}
        run: |
          missing=""
          [ -n "$KEY" ]  || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$URL" ]  || missing="$missing DEPLOY_URL"

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All four secrets are present."

      - name: Open an SSH session
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # A key pasted without its trailing newline is rejected as malformed,
          # which is the most common way this step fails.
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key."
            echo "Paste the whole file, including the BEGIN and END lines."
            exit 1
          fi

          if ! ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts; then
            echo "::error::Could not reach $HOST on port 22."
            exit 1
          fi
          echo "Host key recorded."

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 \
              "$USER@$HOST" 'bash /opt/library/docker/deploy.sh'

      - name: Check the site answers
        env:
          URL: ${{ secrets.DEPLOY_URL }}
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || true)
            echo "attempt $attempt: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "The site did not return 200 after the deploy." >&2
          exit 1
