name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor declared in composer.json; 8.4 proves the lock
        # also installs on a newer runtime than it was resolved against.
        php: ['8.3', '8.4']

    name: test (PHP ${{ matrix.php }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, dom, simplexml, mbstring
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build front-end
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite covers the eight locales, the page cache, the admin panel
      # and the translation files themselves.
      - name: Run tests
        run: php artisan test

      - name: Check formatting
        run: vendor/bin/pint --test

  deploy:
    # Only a green build reaches the server, and only from main.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Open an SSH session
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash /opt/library/docker/deploy.sh'

      - name: Check the site answers
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${{ secrets.DEPLOY_URL }}" || true)
            echo "attempt $attempt: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "The site did not return 200 after the deploy." >&2
          exit 1
